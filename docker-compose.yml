version: '3.9'

services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
    command: ["pnpm", "--filter", "@workspace/api-server", "dev"]
    volumes:
      - .:/app:cached
      - node_modules:/app/node_modules

volumes:
  node_modules:
    name: jenny_ai_clone_node_modules
